services:
  - type: web
    name: dorknet
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - { key: NODE_VERSION, value: "20" }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_ANON_KEY, sync: false }
      - { key: SUPABASE_SERVICE_KEY, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: TELEGRAM_BOT_TOKEN, sync: false }
      - { key: TELEGRAM_CHAT_ID, value: "768138087" }
